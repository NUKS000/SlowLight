<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">SlowLight</title>
  <desc id="desc">Minimal visual breathing pacer for Android</desc>
  <defs>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9d8ff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#8da8ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6b7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f1420"/>
      <stop offset="100%" stop-color="#171d2d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="190" cy="180" r="118" fill="url(#pulse)"/>
  <circle cx="190" cy="180" r="65" fill="#aebfff" opacity="0.28"/>
  <circle cx="190" cy="180" r="24" fill="#dce4ff" opacity="0.95"/>
  <text x="360" y="162" fill="#f5f7ff" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700">SlowLight</text>
  <text x="364" y="215" fill="#adb6cc" font-family="Arial, Helvetica, sans-serif" font-size="25">A quiet visual breathing pacer for Android.</text>
</svg>