name: Bug report
description: Report something that is not working as expected
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with SlowLight.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. Samsung Galaxy S24 Ultra
  - type: input
    id: android
    attributes:
      label: Android version
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: notes
    attributes:
      label: Additional context
