name: Build SlowLight test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run tests and build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Prepare downloadable APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SlowLight-v1.4.1-debug.apk
          sha256sum SlowLight-v1.4.1-debug.apk > SHA256SUMS.txt
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlowLight-v1.4.1-debug
          path: |
            SlowLight-v1.4.1-debug.apk
            SHA256SUMS.txt
      - name: Publish direct-download test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.4.1-debug >/dev/null 2>&1; then
            echo "Versioned test release already exists; retaining the original published APK."
          else
            gh release create v1.4.1-debug SlowLight-v1.4.1-debug.apk SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "SlowLight 1.4.1 (debug test APK)" \
              --notes "Fix: black screen and screen-timeout restoration after a completed breathing session. This is a debug-signed test APK, not a production release. Android may require uninstalling older builds signed with a different key." \
              --prerelease
          fi
